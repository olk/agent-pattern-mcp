[project]
name = "agent-pattern-mcp"
version = "1.0.2"
requires-python = ">=3.12"
description = "MCP server providing AI agent pattern expertise: generate, analyze, and evaluate agent system designs"
license = { text = "MIT" }
authors = [
    { name = "Oliver Kowalke", email = "oliver.kowalke@gmail.com" }
]
keywords = ["mcp", "agent", "ai", "pattern", "design", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=4.0.2",
    "llama-index-core>=0.14.23,<0.15",
    "llama-index-llms-litellm>=0.7.1,<0.8",
    "llama-index-embeddings-litellm>=0.5.0,<0.6",
    "llama-index-retrievers-bm25>=0.7.1,<0.8",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.1",
    "llama-index-postprocessor-tei-rerank>=0.5.0,<0.6",
    "faiss-cpu>=1.14.3",
    "llama-index-vector-stores-faiss>=0.7.0",
    "aiosqlite>=0.20.0",
    "click>=8.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling>=1.0.1"]
build-backend = "hatchling.build"

[project.optional-dependencies]
docs = [
    "sphinx>=7.2.0",
    "sphinx-autoapi>=3.0.0",
    "pydata-sphinx-theme>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # L2 PBT layer (testing-strategies.md §3.3): the crosshair extra is the
    # documented "weak but useful peer" backend — same properties, second
    # engine, advisory only. Floor 6.100 keeps the modern st.characters
    # API (categories=/exclude_categories=) and profiles semantics stable.
    "hypothesis[crosshair]>=6.100,<7",
    # L6 deterministic-simulation peer (testing-strategies §3.7): the DST
    # harness in tests/verification/test_jobs_dst.py is simloom-ready —
    # seeded-scheduler mode maps 1:1 onto the mode-2 races.
    "simloom>=0.5.0",
    "ruff>=0.2.0",
    "mypy>=2.3.1",
    "pre-commit>=3.6.0",
    "vulture>=2.14",
    "deptry>=0.23.0",
]

[project.scripts]
agent-pattern-mcp = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Vulture whitelist contains intentional bare-name references (see whitelist.py).
extend-exclude = ["whitelist.py"]

[tool.ruff.lint.per-file-ignores]
# L3 planted-bug garden: mutants deliberately encode the bug classes the
# oracles must catch (zip-without-strict and manual loop indices ARE the
# mutations; "fixing" them would delete the bugs the garden exists to plant).
"tests/verification/gardens/*" = ["B905", "SIM113"]
# L9 structural invariant checker: one branch per invariant family (INV-1..7)
# is the point of the function — splitting it would hide the invariant set.
"tests/eval/invariants.py" = ["PLR0912"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "ARG", "PL", "TRY", "RUF"]
ignore = [
    "TRY003",
    "TRY301",
    "TRY300",
    "TRY400",
    "E501",
    "E741",
    "E401",
    "E402",
    "PLC0415",
    "PLR0917",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "ARG001",
    "ARG002",
    "ARG005",
    "W293",
    "W291",
    "W292",
    "I001",
    "F401",
    "F811",
    "F841",
    "RUF012",
    "RUF013",
    "RUF022",
    "RUF002",
    "RUF100",
    "UP035",
    "UP036",
    "UP042",
    "DTZ001",
    "DTZ003",
    "PT011",
    "PT015",
    "PT017",
    "PT018",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM110",
    "SIM117",
    "SIM118",
    "RET504",
    "PLW0108",
    "B007",
    "B011",
    "B017",
    "B904",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src"]
explicit_package_bases = true

# Per-module overrides for third-party imports missing py.typed markers
[[tool.mypy.overrides]]
# llama_index.* modules lack py.typed markers
module = ["llama_index.embeddings.litellm", "llama_index.postprocessor.tei_rerank", "llama_index.llms.litellm", "bm25s"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# LiteLLMEmbedding and TextEmbeddingInference are typed as Any; subclassing
# triggers "Class cannot subclass" [misc] error. SafeTEIReranker / InstructionAwareEmbedding
# override only documented public methods, so subclassing is intentional.
module = ["src.patterns.safe_tei_rerank", "src.patterns.embedder"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# src.prompts.examples uses dict literals as Agent/Relationship/etc placeholders
# for hand-crafted few-shot JSON examples. Conversion to Pydantic models would
# lose fidelity (constraints on Field values are too strict for narrative prose).
module = ["src.prompts.examples"]
disable_error_code = ["list-item", "assignment", "arg-type"]

[[tool.mypy.overrides]]
# src.patterns.retriever carries forward Any-typed values from the upstream
# LlamaIndex QueryFusionRetriever and SafeTEIReranker.
module = ["src.patterns.retriever"]
disable_error_code = ["no-any-return", "union-attr"]

[[tool.mypy.overrides]]
# src.tools._adapters uses generic[type[T]] for model_validate, which mypy
# cannot validate against BaseModel's classmethod API.
module = ["src.tools._adapters"]
disable_error_code = ["no-any-return", "attr-defined"]

[[tool.mypy.overrides]]
# src.pipeline carries forward Any from upstream LlamaIndex components;
# many internal helpers return Any in practice.
module = ["src.pipeline"]
disable_error_code = ["no-any-return", "attr-defined"]

[[tool.mypy.overrides]]
# Stemmer (PyStemmer) has no type stubs
module = ["Stemmer"]
ignore_missing_imports = true

[tool.deptry]
extend_exclude = ["verify"]
# verify/ holds the L3 mutmut tooling (never imported by src/ at runtime).
known_first_party = ["src"]
# Treat the docs extras (sphinx toolchain) as build-time-only, not runtime deps.
optional_dependencies_dev_groups = ["docs"]

[tool.deptry.package_module_name_map]
"python-dotenv" = ["dotenv"]
"faiss-cpu" = ["faiss"]
"PyStemmer" = ["Stemmer"]
"llama-index-core" = ["llama_index"]

[tool.deptry.per_rule_ignores]
# litellm (src/agent.py) and workflows (src/pipeline.py) are imported directly
# but provided transitively via llama-index-llms-litellm and llama-index-core
# (which vendors llama-index-workflows). mcp (src/server.py, src/tools/*) is
# imported directly but provided transitively via fastmcp. mutmut is the L3
# ephemeral toolchain (`uv run --with 'mutmut==3.7.*'`), never a project dep.
DEP001 = ["litellm", "workflows", "mcp", "mutmut"]
DEP003 = ["litellm", "workflows", "mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo-root import basis: verification-layer meta-tests and garden bridges
# import `scripts.*` / `verify.*` helpers via `from scripts.… import …` against
# the repo root (mirrors architecture-pattern-mcp).
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "perf: performance benchmarks, opt-in via RUN_PERF=1",
    "llm: live LLM benchmarks, opt-in via AGENT_BENCH_LLM=1 (requires config + endpoint)",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
# Ratchet: unit-suite branch coverage measured at 87% (2026-09-14). Keep at or
# above this floor; raise it as coverage improves, never lower it.
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    # Entry-point guard lines are covered via test_main_entry.py structural checks,
    # not by importing __main__ under coverage.
    "if __name__ == .__main__.:",
    # Defensive guards and typing-only re-exports.
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# L3 mutation testing (testing-strategies.md §3.4):
# mutmut audits the oracles themselves — the answer to same-model circularity
# (68% of AI test suites validate bugs instead of catching them). Scope is the
# Tier A decision modules; run via `make test-mutations` (manual/nightly gate).
# Scope growth follows the ratchet: each newly scoped module needs a dedicated
# kill oracle (see verify/mutmut-scope.md).
[tool.mutmut]
# Mutate the whole src/ tree (mutants/src must be a COMPLETE package for
# imports to resolve during mutmut's pytest runs) and restrict mutation to the
# Tier A modules via do_not_mutate — everything else is copied unmutated.
source_paths = ["src/"]
# mutmut executes pytest from mutants/ — the shim (verify/), the scripts
# imported by tests/verification meta-tests, and the real pattern catalogue
# must be present there (copied unmutated).
also_copy = ["verify/", "scripts/", "pattern/"]
# In-process shim: mutmut 3.7 asserts trampoline-hit module names never start
# with "src." — this repo's import package IS `src`, so the stats run would
# assert on every legitimate hit. The plugin relaxes exactly that assert;
# regular pytest runs never import it.
pytest_add_cli_args = ["-p", "verify.mutmut.mutmut_compat", "--hypothesis-profile=mutmut"]
# Per-mutant wall-clock ceiling: (clean-suite duration + timeout_constant) *
# timeout_multiplier. Bounded so a hung mutant cannot stall the nightly budget.
timeout_constant = 5.0
timeout_multiplier = 6.0
# "rerun" resets cached results when a watched file changes, so the baseline
# gate can never distill stale verdicts after a config/catalogue edit.
on_dependency_change = "rerun"
cache_invalidation_files = ["pattern/*.json"]
# Initial scope (Tier A): the pure decision modules with dedicated kill
# oracles. Everything below is copied unmutated; scope growth is ledger-driven
# (verify/mutmut-scope.md).
do_not_mutate = [
    # [Deferred — awaiting dedicated kill oracles; see verify/mutmut-scope.md]
    "src/config.py",
    "src/reasoning/config.py",
    "src/tools/analyze.py",
    "src/tools/design.py",
    "src/tools/evaluate.py",
    "src/tools/generate.py",
    "src/tools/get_agent_design_status.py",
    "src/tools/patterns.py",
    "src/patterns/nodes.py",
    "src/patterns/retriever.py",
    "src/patterns/embedder.py",
    "src/patterns/safe_tei_rerank.py",
    "src/pipeline.py",
    # [Permanent — excluded by design]
    "src/main.py",
    "src/__main__.py",
    "src/server.py",
    "src/mcp_prompts/*",
    "src/prompts/*",
    "src/reasoning/schemas.py",
    "src/reasoning/__init__.py",
    "src/reasoning/tools.py",
    "src/resources/*",
    "src/schemas/*",
    "src/tools/__init__.py",
    "src/tools/_adapters.py",
    "src/tools/cancel_agent_design.py",
    "src/tools/submit_agent_design.py",
    "src/errors.py",
    "src/agent.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_text_validation.py",
    "tests/unit/test_text_validation_internals.py",
    "tests/unit/test_config_expansion.py",
    "tests/unit/test_pattern_loader.py",
    "tests/unit/test_normalization.py",
    "tests/unit/test_validation.py",
    "tests/unit/test_jobs.py",
    "tests/unit/test_reasoning_client.py",
    "tests/unit/test_reasoning_prompts.py",
    "tests/verification/test_text_validation_properties.py",
    "tests/verification/test_config_properties.py",
    "tests/verification/test_loader_properties.py",
    "tests/verification/test_normalization_idempotence.py",
    "tests/verification/test_jobs_properties.py",
    "tests/verification/test_bug_garden.py",
    "tests/verification/test_garden_bridge.py",
    "tests/verification/test_mutmut_baseline.py",
    "tests/verification/test_mutmut_compat_tmp_isolation.py",
]
